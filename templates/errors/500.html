<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Happy Cake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff6e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #774936;
        }
        .error-container {
            background-color: #fffaf5;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ff9800;  /* Orange for server error */
        }
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .home-btn {
            display: inline-block;
            background-color: #ffadb9;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .home-btn:hover {
            background-color: #ff8c9b;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>Oops! Server Error</h1>
        <p>Something went wrong on our end. Our bakers are working to fix the issue!</p>
        <p>Please try again in a few moments. We apologize for the inconvenience.</p>
        <a href="/" class="home-btn">Back to Home</a>
    </div>
</body>
</html>
