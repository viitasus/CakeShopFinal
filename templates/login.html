{% extends 'base.html' %}

{% block title %}Login - Happy Cake{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 500px;
        margin: 40px auto;
        background-color: var(--soft-white);
        border-radius: 20px;
        box-shadow: 0 5px 15px var(--shadow-color);
        padding: 30px;
    }
    
    .auth-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: var(--primary-brown);
        font-size: 28px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--primary-brown);
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid var(--medium-gray);
        border-radius: 10px;
        font-size: 16px;
    }
    
    .form-group input:focus {
        border-color: var(--primary-pink);
        outline: none;
    }
    
    .checkbox-group {
        display: flex;
        align-items: center;
    }
    
    .checkbox-group input {
        margin-right: 10px;
        width: auto;
    }
    
    .checkbox-group label {
        margin-bottom: 0;
    }
    
    .auth-button {
        width: 100%;
        padding: 12px;
        background-color: var(--primary-pink);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.3s;
        margin-top: 10px;
    }
    
    .auth-button:hover {
        background-color: var(--primary-pink-hover);
        transform: translateY(-2px);
    }
    
    .auth-switch {
        text-align: center;
        margin-top: 20px;
        color: var(--dark-gray);
    }
    
    .auth-switch a {
        color: var(--primary-pink-hover);
        text-decoration: none;
        font-weight: 600;
    }
    
    .auth-switch a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back!</h2>
    
    <form id="login-form" method="post" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
        </div>
        <button type="submit" class="auth-button">Login</button>
        
        <div class="auth-switch">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register Now</a>
        </div>
    </form>
</div>
{% endblock %}
