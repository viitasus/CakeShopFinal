{% extends 'base.html' %}

{% block title %}Login - Happy Cake{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth-styles.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back!</h2>
    
    <form id="login-form">
        <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required>
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="remember-me" name="remember">
            <label for="remember-me">Remember me</label>
        </div>
        <button type="submit" class="auth-button">Login</button>
        
        <div class="auth-switch">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register Now</a>
        </div>
    </form>
    
    <div class="auth-divider">
        <span>or continue to</span>
    </div>
    
    <a href="{{ url_for('main.menu') }}" class="continue-shopping-btn">Browse Cakes</a>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
